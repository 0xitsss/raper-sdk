[package]
name = "raper-sdk"
version = "0.1.0"
edition = "2021"

[dependencies]
alloy = "2.5"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
anyhow = "1"
sha3 = "0.10"
hex = "0.4"

[dev-dependencies]
decoder = { path = "../decoder" }
